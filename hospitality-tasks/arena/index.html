<title>Сауыт Арена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: арочные «двери» номеров 101–505 как навигация; каждая дверь открывает одну игровую ситуацию смены. */
:root{
  --bg:#eef2ff;--card:#ffffff;--ink:#0b1437;--muted:#55608a;--line:#d5dcf5;
  --blue:#2347ff;--on-blue:#ffffff;--blue-soft:#e3e8ff;--sun:#ffcf3f;--on-sun:#0b1437;
  --ok:#0b7a53;--ok-bg:#d9f5e8;--bad:#b9202f;--bad-bg:#fde0e3;--shadow:rgba(35,71,255,.14);
  --r-wall:#dfe5ff;--r-floor:#b9c3f2;--r-bed:#ffffff;--r-bed2:#2347ff;--r-wood:#8a6a4b;--r-curt:#ff8a5c;--r-glass:#bfe6ff;--r-towel:#f3f3f3;--r-bin:#6b7390;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;--f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080d2b;--card:#121a44;--ink:#eef1ff;--muted:#9aa6d6;--line:#27316b;
  --blue:#4a65ff;--blue-soft:#1b2760;--sun:#ffd54d;
  --ok:#4fdca0;--ok-bg:#0f3a2c;--bad:#ff8a97;--bad-bg:#451a26;--shadow:rgba(0,0,0,.45);
  --r-wall:#1b2563;--r-floor:#111945;--r-bed:#e9edff;--r-wood:#a98159;--r-glass:#3a5a9a;--r-towel:#d8dcf0;--r-bin:#8c95b8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080d2b;--card:#121a44;--ink:#eef1ff;--muted:#9aa6d6;--line:#27316b;
  --blue:#4a65ff;--blue-soft:#1b2760;--sun:#ffd54d;
  --ok:#4fdca0;--ok-bg:#0f3a2c;--bad:#ff8a97;--bad-bg:#451a26;--shadow:rgba(0,0,0,.45);
  --r-wall:#1b2563;--r-floor:#111945;--r-bed:#e9edff;--r-wood:#a98159;--r-glass:#3a5a9a;--r-towel:#d8dcf0;--r-bin:#8c95b8;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* hero */
.hero{padding-block:36px 8px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(2rem,6.4vw,3.8rem);font-weight:900;margin-block:10px 14px;letter-spacing:-.02em}
h1 em{font-style:normal;background:var(--sun);color:var(--on-sun);padding:0 .15em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{max-width:56ch;color:var(--muted);font-size:1.05rem}

/* doors */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px;margin-block:30px 10px}
.door{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:80px 80px 14px 14px;padding:26px 16px 16px;cursor:pointer;transition:transform .25s,background .25s,border-color .25s,box-shadow .25s;min-width:0}
.door:hover{transform:translateY(-4px);box-shadow:0 14px 28px var(--shadow)}
.door .no{display:block;font-family:var(--f-display);font-weight:900;font-size:1.7rem;letter-spacing:-.02em;text-align:center}
.door .nm{display:block;text-align:center;font-weight:700;margin-top:2px}
.door .sb{display:block;text-align:center;font-size:.8rem;color:var(--muted)}
.door .st{display:block;text-align:center;margin-top:10px;font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 8px;background:var(--blue-soft);color:var(--blue)}
.door::after{content:"";position:absolute;right:12px;top:58%;width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--on-sun) inset}
.door.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue);transform:translateY(-4px);box-shadow:0 18px 34px var(--shadow)}
.door.on .sb{color:#dfe5ff}.door.on .st{background:var(--sun);color:var(--on-sun)}
.door.fin .st{background:var(--ok-bg);color:var(--ok)}
.door.on.fin .st{background:var(--sun);color:var(--on-sun)}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-block:14px 6px}
.bar{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sun));border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.hud b{font-family:var(--f-display);font-size:1.05rem}
.finalbtn{border:2px solid var(--ink);background:transparent;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.finalbtn:hover{background:var(--ink);color:var(--bg)}

/* panels */
.panel{display:none;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,34px);margin-top:18px;box-shadow:0 22px 48px var(--shadow)}
.panel.on{display:block;animation:open .5s cubic-bezier(.2,.9,.3,1)}
@keyframes open{from{opacity:0;transform:perspective(900px) rotateY(-14deg) translateX(-18px);transform-origin:left}to{opacity:1;transform:none}}
.panel h2{font-size:clamp(1.3rem,3.6vw,2rem);margin-block:6px 8px}
.panel .intro{color:var(--muted);max-width:62ch;margin-bottom:22px}
.mini{font-family:var(--f-body);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.note{margin-top:16px;padding:12px 16px;border-radius:14px;background:var(--blue-soft);font-weight:500;min-height:48px}
.note.ok{background:var(--ok-bg);color:var(--ok)}.note.bad{background:var(--bad-bg);color:var(--bad)}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.lobby>div{min-width:0}
.gcard,.rcard{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .2s,transform .2s}
.gcard:hover:not(:disabled),.rcard:hover:not(:disabled){border-color:var(--blue)}
.gcard.sel{border-color:var(--blue);background:var(--blue-soft);transform:translateX(6px)}
.gcard:disabled,.rcard:disabled{cursor:default}
.gcard.done{opacity:.55}
.av{flex:0 0 42px;height:42px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.gcard b,.rcard b{display:block}
.gcard small,.rcard small{color:var(--muted);display:block;font-size:.88rem;line-height:1.4}
.rno{flex:0 0 66px;font-family:var(--f-display);font-weight:900;font-size:1.35rem;color:var(--blue)}
.rcard.ok{border-color:var(--ok);background:var(--ok-bg)}
.rcard .who{display:block;margin-top:6px;font-weight:700;color:var(--ok)}

/* revenue */
.days{display:grid;gap:18px}
.day{border:2px solid var(--line);border-radius:22px;padding:18px;background:var(--bg);min-width:0}
.day h3{font-size:1.05rem}.day p{color:var(--muted);font-size:.92rem;margin-block:4px 14px}
.price{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.price b{font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.kpi small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.kpi b{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;margin-block:6px 12px}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.res{font-weight:600;margin-top:10px}

/* inspect */
.insp{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.room{width:100%;height:auto;border-radius:20px;border:2px solid var(--line);background:var(--r-wall);display:block}
.hot{cursor:pointer}.hot:hover{filter:brightness(1.08)}
.ring{fill:none;stroke:var(--sun);stroke-width:3;display:none}
.hot.found .ring{display:block;animation:pulse 1.4s infinite}
@keyframes pulse{50%{stroke-width:6;opacity:.6}}
.chk{list-style:none;display:grid;gap:8px}
.chk,.brk{padding:0;margin:0}
.chk li{padding:10px 12px;border-radius:12px;border:2px dashed var(--line);font-size:.92rem;color:var(--muted)}
.chk li.on{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-style:solid}
.chk li b{display:block}

/* overbooking */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.meter small{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:.82rem}
.meter .tr{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.meter .tr i{display:block;height:100%;width:50%;border-radius:99px;background:var(--blue);transition:width .8s cubic-bezier(.2,.9,.3,1),background .4s}
.scene{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px 20px;margin-bottom:14px;font-size:1.02rem}
.scene small{display:block;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:6px;font-size:.72rem;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;font-size:1rem;cursor:pointer;transition:border-color .2s,transform .2s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(5px)}
.opt:disabled{cursor:default}.opt.best{border-color:var(--ok);background:var(--ok-bg)}.opt.pick{border-color:var(--bad);background:var(--bad-bg)}.opt.best.pick{border-color:var(--ok);background:var(--ok-bg)}

/* review */
.review{background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:18px}
.review .stars{color:var(--sun);letter-spacing:.15em;font-size:1.2rem;text-shadow:0 0 1px var(--on-sun)}
.slot{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 13px;font-size:.92rem;cursor:pointer;text-align:left;transition:all .2s;max-width:100%}
.chip:hover:not(:disabled){border-color:var(--blue)}
.chip.sel{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip:disabled{cursor:default}
.chip.best{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.chip.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bubble{background:var(--blue-soft);border-radius:20px 20px 20px 4px;padding:14px 18px;margin-block:8px 16px;min-height:60px}
.bubble span.h{color:var(--muted)}

/* badge */
.final{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.badge{background:var(--blue);color:var(--on-blue);border-radius:26px;padding:46px 22px 24px;text-align:center;position:relative;box-shadow:0 24px 50px var(--shadow);transform:rotate(-2deg)}
.badge::before{content:"";position:absolute;left:50%;top:14px;width:64px;height:12px;border-radius:99px;background:var(--bg);transform:translateX(-50%)}
.badge .bh{font-family:var(--f-display);font-size:.74rem;letter-spacing:.2em}
.badge .big{width:104px;height:104px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:2.4rem;margin:16px auto}
.badge .bn{font-family:var(--f-display);font-size:1.3rem;font-weight:700;overflow-wrap:anywhere;min-height:1.5em}
.badge .br{display:inline-block;margin-top:10px;background:var(--sun);color:var(--on-sun);border-radius:99px;padding:5px 14px;font-weight:700;font-size:.9rem}
.badge .sc{margin-top:14px;font-size:.9rem;opacity:.9}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:var(--bg);color:var(--ink);margin-block:6px 18px}
.brk{list-style:none;display:grid;gap:8px}
.brk li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}

.pf{position:fixed;pointer-events:none;width:9px;height:14px;border-radius:2px;z-index:50}

@media (max-width:720px){
  .lobby,.insp,.final{grid-template-columns:1fr}
  .meters{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr 1fr}
  .badge{transform:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.gate{min-height:92vh;display:grid;place-items:center;padding-block:40px}
.gate[hidden],#app[hidden]{display:none!important}
.gatecard{max-width:560px;width:100%}
.gatecard h1{margin-block:8px 12px}
.keycard{width:150px;height:92px;border-radius:12px;background:var(--blue);color:var(--on-blue);transform:rotate(-8deg);position:relative;margin-bottom:26px;box-shadow:0 18px 34px var(--shadow);display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--f-display);font-weight:900;letter-spacing:.12em;font-size:.8rem}
.keycard i{position:absolute;left:0;right:0;top:18px;height:16px;background:var(--on-sun);opacity:.85}
.nmerr{color:var(--bad);font-weight:600;min-height:1.6em;margin-bottom:6px}
.gatecard .btn{width:100%;font-size:1.05rem;padding:14px}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{width:28px;height:6px;border-radius:99px;background:var(--line)}.dots i.d{background:var(--ok)}.dots i.c{background:var(--blue)}
.mt{display:block;color:var(--muted);font-size:.86rem;font-weight:400;margin-top:2px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.fgrid.rows{grid-template-columns:1fr}
.fl{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;cursor:pointer;min-width:0;transition:border-color .2s,background .2s}
.fl:hover{border-color:var(--blue)}
.fl small{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.fl b{display:block;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fl.flag{border-color:var(--blue);background:var(--blue-soft)}
.fl.hit{border-color:var(--ok);background:var(--ok-bg)}.fl.fp{border-color:var(--bad);background:var(--bad-bg)}.fl.miss{border-color:var(--bad);border-style:dashed}
ol.order{list-style:none;padding:0;display:grid;gap:8px}
ol.order li{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px}
ol.order li span{flex:1;min-width:0}
ol.order li.ok{border-color:var(--ok);background:var(--ok-bg)}ol.order li.bad{border-color:var(--bad);background:var(--bad-bg)}
ol.order button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.fgrid+p,.scene+.opt{margin-top:0}

/* ---- v4 additions ---- */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:14px 0}
.topbar .who{font-weight:600;color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--ink);color:var(--bg)}
.gatecard .lang{margin-bottom:18px}
.gatecard label.mini{display:block;margin-top:16px}
.gatecard input[type=text]{margin-block:6px 0}
.tg{display:grid;gap:10px;margin-top:22px}
.banner{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;margin-top:14px}
.banner.info{background:var(--blue-soft);color:var(--ink)}
.doors{grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.door{padding:22px 10px 12px}
.door .no{font-size:1.35rem}
.door .mn{display:block;text-align:center;font-size:.72rem;color:var(--muted);margin-top:2px}
.door.on .mn{color:#dfe5ff}
.pfoot{display:none;margin-top:22px;padding-top:16px;border-top:2px dashed var(--line);justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pfoot.show{display:flex}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.row2>*{min-width:0}
.tile{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;font-size:.95rem;transition:border-color .2s,background .2s;min-width:0}
.tile:hover:not(:disabled){border-color:var(--blue)}
.tile:disabled{cursor:default}
.tile.used{opacity:.55}
.tile.sel{border-color:var(--blue);background:var(--blue-soft)}
.tile b{display:block}
.tile small{display:block;color:var(--muted);font-size:.84rem;font-weight:400}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
.tile.good{border-color:var(--ok);background:var(--ok-bg)}
.chat{display:grid;gap:8px;margin-block:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:.96rem}
.msg.me{justify-self:end;background:var(--blue);color:var(--on-blue);border-bottom-right-radius:4px}
.msg.gu{justify-self:start;background:var(--blue-soft);border-bottom-left-radius:4px}
.msg.gu.cold{background:var(--bad-bg);color:var(--bad)}
.tok{font-family:var(--f-display);font-weight:700}
.sticky-stat{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:12px;font-weight:600}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:10px}
textarea{width:100%;min-height:170px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
select{padding:9px 10px;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);max-width:100%}
input[type=number],input[type=text]{color:var(--ink)}
.num{padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);width:100%;max-width:220px;font-variant-numeric:tabular-nums}
.fieldrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.fieldrow label{flex:1 1 220px;font-weight:600}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--blue-soft);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--blue-soft)}
tr.flag td{background:var(--blue-soft)}
tr.hit td{background:var(--ok-bg)}tr.fp td{background:var(--bad-bg)}tr.miss td{background:var(--bad-bg);font-weight:700}
.det{font-size:.9rem;color:var(--muted)}
details{border:2px dashed var(--line);border-radius:12px;padding:8px 14px;margin-block:12px}
details summary{cursor:pointer;font-weight:600}
.gantt{width:100%;height:auto;display:block;margin-block:10px}
.gantt text{font-size:9px;fill:var(--muted);font-family:var(--f-body)}
.hkr{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--bg)}
.hkr .nm{min-width:0}

async function initCaps(){

    if(user){try{S.id=await user.id()}catch(e){}}
    if(db&&S.id)dbDoc=db.doc('students/'+S.id);
    if(dbDoc&&!S.name){try{const sn=await dbDoc.get();if(sn&&sn.exists){const d=sn.data()||{};if(d.name){S.name=d.name;S.group=d.group||'';S.res=d.res||{};S.time=d.time||{};S.startedAt=d.startedAt||Date.now();S.doorId=(d.door&&d.door!=='final')?d.door:'';saveLocal();STORE.set('sauyt_active','1');resumeStudent()}}}catch(e){}}

/* ── gate ── */

   :`<p style="margin-top:22px"><button class="finalbtn" id="tLink">${U('tLink')}</button></p>`}`;
  $('#nm0').value=keep.n!=null&&keep.n!==''?keep.n:S.name;$('#gp0').value=keep.g!=null&&keep.g!==''?keep.g:S.group;
  $$('.lang button',g).forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function setLang(l){

const hooks=[];
function startStudent(practice){
  const v=$('#nm0').value.trim();

    return `<button class="door ${i===S.door&&!showFinal?'on':''} ${r?'fin':''}" data-i="${i}" aria-label="${m.no} ${esc(L(m.title))}"><span class="ic">${ICONS[m.id]||'🎯'}</span><span class="no">${m.no}</span><span class="nm">${esc(L(m.title))}</span><span class="sb">${esc(L(m.sub))}</span><span class="mn">~${m.min} ${U('min')}</span><span class="stars">${starsOf(r)}</span><span class="st">${r?`${r.s} ${U('of')} ${r.m}`:U('open')}</span></button>`}).join('');

let showFinal=false;
function leaveDoor(){
  const m=MODS[S.door];if(m&&S.enter&&!showFinal){S.time[m.id]=(S.time[m.id]||0)+Math.round((Date.now()-S.enter)/1000)}
  S.enter=Date.now();
}
function show(i){
  if(i<MODS.length&&!on(MODS[i]))return;
  leaveDoor();showFinal=(i>=MODS.length);if(!showFinal)S.door=i;
  $$('.panel').forEach((p,k)=>p.classList.toggle('on',k===i));
  {const pe=$$('.panel')[i];if(pe)pe.dispatchEvent(new Event('panelshow'))}
  if(showFinal&&!S.fin){S.fin=true}
  drawDoors();if(showFinal)finalDraw();persist();

}
function footDraw(i){
  const f=$$('.pfoot')[i];if(!f)return;const m=MODS[i],r=S.res[m.id];
  f.classList.toggle('show',!!r);
  if(r){const nx=MODS.findIndex((z,k)=>k>i&&on(z));const last=nx<0;f.innerHTML=`<span><b>${U('done')}</b> · ${r.s} ${U('of')} ${r.m}</span><button class="btn">${last?U('finBtn'):U('next')}</button>`;$('button',f).onclick=()=>show(last?MODS.length:nx)}
}
function burst(from){
  if(reduce)return;const r=from.getBoundingClientRect(),x0=r.left+r.width/2,y0=Math.min(Math.max(80,r.top+60),innerHeight-80);
  const cols=['#ffcf3f','#2347ff','#ff6b6b','#2ee59d','#ffffff'];
  for(let i=0;i<34;i++){const p=document.createElement('i');p.className='pf';p.style.background=cols[i%cols.length];p.style.left=x0+'px';p.style.top=y0+'px';document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=90+Math.random()*190;
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+140}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100+Math.random()*700,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>p.remove();}
}
function makeApi(m,i,root){
  return {
    lang:()=>LANG,L,esc,fmt,
    rng:(sfx)=>mulberry(hash(key()+'|'+m.id+(sfx||''))),
    finish(score,ans){
      score=Math.max(0,Math.min(m.max,Math.round(score)));
      leaveDoor();const old=S.res[m.id];
      const a={};if(ans)for(const k in ans)a[k]=String(ans[k]).slice(0,1500);
      if(!old||score>=old.s)S.res[m.id]={s:score,m:m.max,t:S.time[m.id]||0,a};
      drawDoors();footDraw(i);persist();burst(root);
    },
    onLang(fn){hooks.push(fn)},
    persist(get,set){const k='sauyt_m_'+m.id+'_'+hash(key());try{const raw=STORE.get(k);if(raw)set(JSON.parse(raw))}catch(e){}snaps.push(()=>{try{STORE.set(k,JSON.stringify(get()))}catch(e){}})},
    done:()=>!!S.res[m.id]
  };
}

function codeOf(){
  const o={n:S.name,g:S.group,l:LANG,s:S.startedAt,r:{}};
  ONMODS().forEach(m=>{const x=S.res[m.id];if(!x)return;const a={};let c=0;for(const k in (x.a||{})){if(c++>=3)break;a[k.slice(0,40)]=String(x.a[k]).slice(0,220)}o.r[m.id]=[x.s,x.m,x.t,a]});
  return 'SAUYT1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeCodes(text){
  const out=[];(String(text).match(/SAUYT1:[A-Za-z0-9+\/=]+/g)||[]).forEach(c=>{
    try{const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(7)))));if(!o||!o.n)return;
      const res={};let tot=0,k=0;for(const id in o.r){const v=o.r[id];res[id]={s:v[0],m:v[1],t:v[2],a:v[3]||{}};tot+=v[0];k++}
      out.push({id:'imp_'+hash((o.n+'|'+(o.g||'')).toLowerCase()),name:o.n,group:o.g||'',lang:o.l,startedAt:o.s||0,res,tot,k,imp:true,lastAt:0})}catch(e){}});
  return out;
}
function resultText(){
  const lines=[`${S.name}${S.group?' ('+S.group+')':''} — ${total()} / ${MAXPTS()}`].concat(ONMODS().map(m=>{const x=S.res[m.id];return `${m.no} ${L(m.title)}: ${x?x.s+'/'+x.m+', '+Math.round((x.t||0)/60)+' мин':'—'}`}));
  return lines.join('\n')+'\n\n'+codeOf();
}

function verdictOf(p){return p>=.8?'ok':p>=.5?'mid':'bad'}
function studentAnalysis(r){
  const res=r.res||{};
  const items=ONMODS().filter(m=>m.max>0).map(m=>{const x=res[m.id];if(!x)return{m,v:'none'};const p=x.s/x.m,t=x.t||0;let flag='';
    if(p>=.7&&t<m.min*60*.2)flag='aFast';else if(p<.5&&t>m.min*60*2)flag='aSlow';return{m,p,v:verdictOf(p),t,flag}});
  const done=items.filter(i=>i.v!=='none');
  if(!done.length)return `<p class="det">${U('aNoData')}</p>`;
  const sk={};done.forEach(i=>{const k=SKMAP[i.m.id];if(!k)return;(sk[k]=sk[k]||[]).push(i.p)});
  const lab={ok:U('aOk'),mid:U('aMid'),bad:U('aBad')};
  const bad=done.filter(i=>i.v!=='ok').sort((a,b)=>a.p-b.p);
  return `<div class="mini" style="margin-top:14px">${U('aSkills')}</div>
  <div class="mgrid">${Object.keys(U('aSk')).filter(k=>sk[k]).map(k=>{const v=sk[k].reduce((a,b)=>a+b,0)/sk[k].length;const col=v>=.8?'var(--ok)':v>=.5?'var(--sun)':'var(--bad)';return `<div class="meter"><small>${esc(U('aSk')[k])}<span>${Math.round(v*100)}%</span></small><div class="tr"><i style="width:${Math.round(v*100)}%;background:${col}"></i></div></div>`}).join('')}</div>
  <p class="det">${U('aSum')}: <b>${done.filter(i=>i.v==='ok').length}</b> / <b>${done.filter(i=>i.v==='mid').length}</b> / <b>${done.filter(i=>i.v==='bad').length}</b></p>
  <ul class="crit">${items.map(i=>i.v==='none'?`<li><span>${i.m.no} · ${esc(L(i.m.title))}</span><b>${U('aNone')}</b></li>`:`<li class="${i.v==='ok'?'ok':i.v==='bad'?'no':''}"><span>${i.m.no} · ${esc(L(i.m.title))}${i.v!=='ok'&&TOPIC[i.m.id]?`<br><span class="det">${U('aTopics')}: ${esc(L(TOPIC[i.m.id]))}</span>`:''}${i.flag?`<br><span class="det" style="color:var(--bad)">⚠ ${U(i.flag)}</span>`:''}</span><b>${lab[i.v]} · ${Math.round(i.p*100)}%</b></li>`).join('')}</ul>`;
}
function classAnalysis(rows){
  const st=ONMODS().filter(m=>m.max>0).map(m=>{const xs=rows.map(r=>r.res&&r.res[m.id]).filter(Boolean);const n=xs.length;const avg=n?xs.reduce((a,x)=>a+x.s/x.m,0)/n:null;const okN=xs.filter(x=>x.s/x.m>=.8).length;return{m,n,avg,okN}}).filter(x=>x.n>0);
  if(!st.length)return `<p class="det">${U('aNoData')}</p>`;
  st.sort((a,b)=>a.avg-b.avg);
  const weak=st.filter(x=>x.avg<.7).slice(0,5),strong=[...st].reverse().filter(x=>x.avg>=.8).slice(0,3);
  const bar=x=>{const v=Math.round(x.avg*100);const col=x.avg>=.8?'var(--ok)':x.avg>=.5?'var(--sun)':'var(--bad)';return `<div class="meter" style="margin-bottom:8px"><small>${x.m.no} · ${esc(L(x.m.title))}<span>${U('aAvg')} ${v}% · ${U('aN')} ${x.n} · ${U('aOk')} ${x.okN}</span></small><div class="tr"><i style="width:${v}%;background:${col}"></i></div></div>`};
  return `${weak.length?`<div class="mini">${U('aWeak')}</div><ul class="crit">${weak.map(x=>`<li class="no"><span><b>${x.m.no} · ${esc(L(x.m.title))}</b><br><span class="det">${esc(L(TOPIC[x.m.id]||''))}</span></span><b>${Math.round(x.avg*100)}%</b></li>`).join('')}</ul>`:''}
  ${strong.length?`<div class="mini" style="margin-top:12px">${U('aStrong')}</div><ul class="crit">${strong.map(x=>`<li class="ok"><span>${x.m.no} · ${esc(L(x.m.title))}</span><b>${Math.round(x.avg*100)}%</b></li>`).join('')}</ul>`:''}
  <details style="margin-top:12px"><summary>${U('aAll')}</summary><div style="margin-top:10px">${st.map(bar).join('')}</div></details>`;
}

function tDetail(r){
  const res=r.res||{};
  return `<div class="panel on" id="tdet"><div class="eyebrow">${U('tDetail')}</div><h2>${esc(r.name)} <span class="tag">${r.tot||0} / ${MAXPTS()}</span></h2>
  <div class="mini">${U('aTitle')}</div>${studentAnalysis(r)}
  <ul class="brk">${MODS.filter(m=>on(m)||res[m.id]).map(m=>{const x=res[m.id];return `<li><span>${m.no} · ${esc(L(m.title))}</span><b>${x?`${x.s} / ${x.m} · ${Math.round((x.t||0)/60*10)/10} ${U('tMinShort')}`:'—'}</b></li>`}).join('')}</ul>
  ${MODS.map(m=>{const x=res[m.id];if(!x||!x.a||!Object.keys(x.a).length)return '';return `<div class="mini" style="margin-top:16px">${m.no} · ${esc(L(m.title))} · ${U('tAns')}</div>`+Object.entries(x.a).map(([k,v])=>`<div class="det">${esc(k)}</div><div class="ans">${esc(v)}</div>`).join('')}).join('')}
  <button class="btn sm ghost" id="tdetClose">${U('tClose')}</button></div>`;
}
async function tCsv(rows){
  const head=['name','group','lang','done','total',...MODS.map(m=>m.id+'_score'),...MODS.map(m=>m.id+'_sec')];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[head.join(',')].concat(rows.map(r=>[q(r.name),q(r.group),r.lang||'',r.k||0,r.tot||0,...MODS.map(m=>(r.res&&r.res[m.id]?r.res[m.id].s:'')),...MODS.map(m=>(r.res&&r.res[m.id]?r.res[m.id].t:''))].join(',')));
  try{await caps.dl.save({filename:'sauyt-results.csv',data:'﻿'+lines.join('\n')})}catch(e){}
}

function swipeDeck(root,api,cfg){
  const R=api.rng();
  const cards=cfg.build(R);
  const N=cards.length,PER=cfg.per||10;
  let i=0,correct=0,streak=0,best=0,log=[],done=false,res=null,started=false,tmr=null,t0=0,locked=false;
  const t=k=>cfg.T[api.lang()][k];
  function draw(){
    clearInterval(tmr);
    const lg=api.lang(),x=cfg.T[lg];
    if(done){
      root.innerHTML=`<div class="eyebrow">${x.eb}</div><h2>${x.h}</h2><div class="note ${res.sc>=8?'ok':res.sc>=5?'':'bad'}"><div class="mini">${x.res}</div><b class="verdict">${res.sc} / 10</b><p>${x.right}: ${correct} / ${N} · ${x.streak}: ${best}</p></div>
      ${log.filter(l=>!l.ok).length?`<div class="mini" style="margin-top:14px">${x.mist}</div><ul class="crit">${log.filter(l=>!l.ok).map(l=>`<li class="no"><span>${esc(cards[l.i].tx[lg])}<br><span class="det">${l.to?x.timeout+'. ':''}${esc(cards[l.i].why[lg])}</span></span><b>${cards[l.i].ans?x.yes:x.no}</b></li>`).join('')}</ul>`:''}`;
      return;
    }
    if(!started){
      root.innerHTML=`<div class="eyebrow">${x.eb}</div><h2>${x.h}</h2><p class="intro">${x.intro}</p><p style="margin-top:14px"><button class="btn sun" id="go">${x.start}</button></p>`;
      $('#go',root).onclick=()=>{started=true;draw()};return;
    }
    const c=cards[i];
    root.innerHTML=`<div class="eyebrow">${x.eb}</div><h2>${x.h}</h2>
    <div class="dots">${cards.map((_,k)=>`<i class="${k<i?'d':k===i?'c':''}" style="width:${Math.max(6,Math.floor(260/N))}px"></i>`).join('')}</div>
    <div class="sticky-stat"><span>${x.right}: <span class="tok">${correct}</span></span><span>${x.streak}: <span class="tok">${streak}</span>${streak>=3?' 🔥':''}</span></div>
    <div class="timebar"><i id="tb" style="width:100%"></i></div>
    ${c.rule?`<p class="det" style="margin-bottom:8px">${esc(c.rule[lg])}</p>`:''}
    <div class="swarea"><div class="swlab l" id="ll">← ${x.no}</div><div class="swlab r" id="rl">${x.yes} →</div><div class="swc" id="swc">${esc(c.tx[lg])}</div></div>
    <div class="swbtn"><button class="btn bad" id="bn">✕ ${x.no}</button><button class="btn good" id="by">✓ ${x.yes}</button></div><div class="swfb" id="fb"></div>`;
    t0=performance.now();locked=false;
    tmr=setInterval(()=>{const r=1-(performance.now()-t0)/(PER*1000);const tb=$('#tb',root);if(tb)tb.style.width=Math.max(0,r*100)+'%';if(r<=0)decide(null,true)},100);
    const el=$('#swc',root);let sx=0,dx=0,drag=false;
    el.onpointerdown=e=>{drag=true;sx=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
    el.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;$('#ll',root).style.opacity=Math.min(1,Math.max(0,-dx/90));$('#rl',root).style.opacity=Math.min(1,Math.max(0,dx/90))};
    el.onpointerup=e=>{if(!drag)return;drag=false;el.style.transition='transform .25s';if(dx>90)decide(true);else if(dx<-90)decide(false);else{el.style.transform='';$('#ll',root).style.opacity=0;$('#rl',root).style.opacity=0}dx=0};
    $('#bn',root).onclick=()=>decide(false);$('#by',root).onclick=()=>decide(true);
  }
  function decide(v,to){
    if(locked)return;locked=true;clearInterval(tmr);
    const lg=api.lang(),x=cfg.T[lg],c=cards[i],ok=!to&&v===c.ans;
    const el=$('#swc',root),fb=$('#fb',root);
    if(el){el.style.transition='transform .35s,opacity .35s';el.style.transform=`translateX(${v===false?-420:v===true?420:0}px) rotate(${v===false?-25:25}deg)`;el.style.opacity='0'}
    if(ok){correct++;streak++;best=Math.max(best,streak)}else streak=0;
    log.push({i,ok,to:!!to});
    fb.className='swfb show '+(ok?'ok':'bad');fb.textContent=(ok?'✓ ':'✗ ')+(ok?'':(to?x.timeout+'. ':'')+c.why[lg]);
    setTimeout(()=>{i++;if(i>=N){done=true;const sc=Math.max(0,Math.round(10*correct/N));res={sc};draw();api.finish(sc,{'Верных':correct+' / '+N,'Серия':best,'Ошибки':log.filter(l=>!l.ok).map(l=>cards[l.i].tx.ru.slice(0,60)).join(' | ')})}else draw()},ok?650:1700);
  }
  api.persist(()=>({i,correct,streak,best,log,done,res,started:started&&!done?false:started}),s=>{i=s.i||0;correct=s.correct||0;streak=s.streak||0;best=s.best||0;log=s.log||[];done=!!s.done;res=s.res||null;started=!!s.started});
  api.onLang(draw);draw();
}

   {c:1,id:'h4',cost:6300,n:{ru:'Рёбрышки BBQ',kk:'BBQ қабырға еті'},i:{ru:'свиные рёбра, соус BBQ с перцем чили, кукуруза',kk:'шошқа қабырғасы, чили бұрышты BBQ тұздығы, жүгері'},t:['meat','pork','spicy']},
   {c:1,id:'h5',cost:4900,n:{ru:'Паста с песто',kk:'Песто тұздықты паста'},i:{ru:'паста из пшеничной муки, песто из базилика и кедровых орехов, пармезан',kk:'бидай ұнынан паста, райхан мен самырсын жаңғағынан песто, пармезан'},t:['gluten','nut']},
   {c:1,id:'h6',cost:5600,n:{ru:'Бешбармак из баранины',kk:'Қой етінен бесбармақ'},i:{ru:'баранина (халяль), домашняя лапша из пшеничной муки, лук-бульон',kk:'қой еті (халал), бидай ұнынан үй кеспесі, пияз сорпасы'},t:['meat','gluten']},
   /* десерты */
   {c:2,id:'d1',cost:1800,n:{ru:'Тирамису',kk:'Тирамису'},i:{ru:'маскарпоне, печенье савоярди, кофе, ликёр Марсала',kk:'маскарпоне, савоярди печеньесі, кофе, Марсала ликёрі'},t:['gluten','alc','sugar']},
   {c:2,id:'d2',cost:1500,n:{ru:'Фруктовая тарелка',kk:'Жеміс табағы'},i:{ru:'арбуз, дыня, виноград, киви, без добавок',kk:'қарбыз, қауын, жүзім, киви, қоспасыз'},t:[]},
   {c:2,id:'d3',cost:2300,n:{ru:'Шоколадный брауни',kk:'Шоколадты брауни'},i:{ru:'шоколад, мука, сахар, грецкий орех',kk:'шоколад, ұн, қант, жаңғақ'},t:['gluten','nut','sugar']},
   {c:2,id:'d4',cost:1100,n:{ru:'Панна-котта на стевии',kk:'Стевиядағы панна-котта'},i:{ru:'сливки, желатин, стевия, ягодный соус без сахара',kk:'кілегей, желатин, стевия, қантсыз жидек тұздығы'},t:[]}
  ];
  const BAN={veg:['meat','pork','fish'],halal:['pork','alc'],nut:['nut'],gf:['gluten'],dia:['sugar'],kid:['spicy','alc']};
  const R=api.rng();
  /* какие группы и сколько человек */
  const all=shufR(Object.keys(BAN),R);
  const GK=all.slice(0,3).sort();
  const GN={};let sum=0;GK.forEach(k=>{GN[k]=2+Math.floor(R()*4);sum+=GN[k]});
  const NR=Math.min(sum,14); /* число гостей с ограничениями (группы могут пересекаться) */
  const sel=[{g:'',a:''},{g:'',a:''},{g:'',a:''}];
  let done=false,res=null;
  const byId=id=>DS.find(d=>d.id===id);
  const forb=()=>GK.reduce((s,k)=>s.concat(BAN[k]),[]);
  const unsafeFor=(d,keys)=>{const f=keys.reduce((s,k)=>s.concat(BAN[k]),[]);return d.t.filter(x=>f.indexOf(x)>=0)};
  const L=()=>api.lang();
  function totals(){
    let c=0;
    for(let i=0;i<3;i++){const g=byId(sel[i].g);if(!g)continue;const a=sel[i].a&&sel[i].a!==sel[i].g?byId(sel[i].a):null;
      if(a){c+=g.cost*(N-NR)+a.cost*NR}else c+=g.cost*N}
    return c;
  }
  const tagName={ru:{meat:'мясо',pork:'свинина',fish:'рыба',nut:'орехи',alc:'алкоголь',gluten:'глютен',sugar:'сахар',spicy:'острое'},kk:{meat:'ет',pork:'шошқа еті',fish:'балық',nut:'жаңғақ',alc:'алкоголь',gluten:'глютен',sugar:'қант',spicy:'ащы'}};
  function evaluate(){
    const x=T[L()];let probs=[];let safeCourses=0;
    for(let i=0;i<3;i++){
      const g=byId(sel[i].g),aid=sel[i].a&&sel[i].a!==sel[i].g?sel[i].a:'',a=aid?byId(aid):null;
      /* ограничения касаются NR гостей: блюдо "для них" = alt если есть, иначе общее */
      const target=a||g;const u=target?unsafeFor(target,GK):['x'];
      if(target&&!u.length)safeCourses++;
      else if(target)probs.push({course:i,d:target,tags:u});
    }
    const cost=totals(),rev=N*PRICE,mg=(rev-cost)/rev;
    const meatOk=!!(byId(sel[1].g)&&byId(sel[1].g).t.indexOf('meat')>=0);const sPts=Math.round((5*safeCourses/3+(meatOk?1:0))*10)/10;
    const mPts=mg>=TARGET?4:mg>=0.2?2.5:mg>=0.1?1:0;
    const sc=Math.round(sPts+mPts);
    return{sc,sPts,mPts,meatOk,probs,cost,rev,mg,safeCourses};
  }
  function dishCard(d,course,role,cur){
    const x=T[L()];
    const warn=role==='a'&&(!cur&&false);
    return `<button class="tile ${cur===d.id?'sel':''}" data-c="${course}" data-r="${role}" data-d="${d.id}" ${done?'disabled':''}><b>${esc(d.n[L()])}</b><small>${esc(d.i[L()])}</small><small>${d.cost.toLocaleString('ru-RU')} ₸ · ${x.per}</small></button>`;
  }
  function draw(){
    const x=T[L()];
    const cost=totals(),mg=(N*PRICE-cost)/(N*PRICE);
    root.innerHTML=`<div class="eyebrow">${x.eb}</div><h2>${x.h}</h2><p class="intro">${x.intro}</p>
    <div class="note"><b>${x.guests}: ${N}</b><br>${GK.map(k=>`${x.cons[k]}: ${GN[k]}`).join(' · ')}<div class="det">${L()==='kk'?`Бір қонақта бірнеше шектеу болуы мүмкін. Шектеуі бар қонақтар саны: ${NR}`:`У одного гостя может быть несколько ограничений. Гостей с ограничениями: ${NR}`}</div></div>
    ${[0,1,2].map(i=>`<div class="bcourse"><h3>${x.c[i]}</h3>
      <div class="mini">${x.all}</div>
      <div class="bgrid">${DS.filter(d=>d.c===i).map(d=>dishCard(d,i,'g',sel[i].g)).join('')}</div>
      <div class="mini" style="margin-top:8px">${x.alt}</div>
      <div class="bgrid">${DS.filter(d=>d.c===i).map(d=>dishCard(d,i,'a',sel[i].a)).join('')}</div></div>`).join('')}
    <div class="bsum ${mg>=TARGET?'ok':mg>=0.1?'mid':'bad'}"><span>${x.price}: ${(N*PRICE).toLocaleString('ru-RU')} ₸</span><span>${x.cost}: ${cost.toLocaleString('ru-RU')} ₸</span><b>${x.margin}: ${Math.round(mg*100)}%</b></div>
    ${done?resHtml():`<p style="margin-top:14px"><button class="btn" id="sub" ${sel.every(s=>s.g)?'':'disabled'}>${x.check}</button></p>`}`;
    root.querySelectorAll('button.tile').forEach(b=>b.onclick=()=>{
      if(done)return;const c=+b.dataset.c,r=b.dataset.r,id=b.dataset.d;
      if(r==='g')sel[c].g=id;else sel[c].a=sel[c].a===id?'':id;draw();
    });
    const sb=$('#sub',root);if(sb)sb.onclick=submit;
    if(done)$('#again',root).onclick=()=>{done=false;res=null;draw()};
  }
  function submit(){
    res=evaluate();done=true;draw();
    api.finish(res.sc,{'Меню':sel.map((s,i)=>byId(s.g).n.ru+(s.a&&s.a!==s.g?' / для ограничений: '+byId(s.a).n.ru:'')).join('; '),'Группы':GK.join(','),'Маржа':Math.round(res.mg*100)+'%','Безопасных блюд':res.safeCourses+' / 3'});
  }
  function resHtml(){
    const x=T[L()],r=res;
    const probLines=r.probs.map(p=>`<li class="no"><span>${esc(x.c[p.course])}: ${esc(x.bad(p.d.n[L()],p.tags.map(t=>tagName[L()][t]).join(', ')))}</span></li>`).join('');
    return `<div class="note ${r.sc>=8?'ok':r.sc>=5?'':'bad'}" style="margin-top:14px"><div class="mini">${x.res}</div><b class="verdict">${r.sc} / 10</b>
    <ul class="crit"><li class="${r.safeCourses===3?'ok':'no'}"><span>${x.safe}: ${r.safeCourses} / 3<br>${r.probs.length?'':'<span class="det">'+x.ok+'</span>'}${r.meatOk?'':'<br><span class="det">'+x.noMeat+'</span>'}</span><b>${r.sPts.toFixed(1)} / 6</b></li>
    <li class="${r.mPts===4?'ok':'no'}"><span>${x.mrg}: ${Math.round(r.mg*100)}%<br><span class="det">${r.mPts===4?x.mOk:r.mPts>0?x.mMid:x.mBad}</span></span><b>${r.mPts.toFixed(1)} / 4</b></li>${probLines}</ul>
    <p class="det">${x.tipS}</p><p><button class="btn" id="again">${x.again}</button></p></div>`;
  }
  api.persist(()=>({sel,done,res}),s=>{if(s.sel)for(let i=0;i<3;i++)Object.assign(sel[i],s.sel[i]||{});done=!!s.done;res=s.res||null});
  api.onLang(draw);draw();
}});
